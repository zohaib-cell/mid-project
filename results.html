<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Analyzer - Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .scanner-container {
            width: 300px;
            height: 400px;
            position: relative;
            margin-bottom: 2rem;
        }

        .document-icon {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .document-lines {
            position: absolute;
            width: 80%;
            left: 10%;
            top: 20%;
        }

        .doc-line {
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            margin: 15px 0;
            border-radius: 5px;
        }

        .doc-line:nth-child(2) { width: 60%; }
        .doc-line:nth-child(4) { width: 70%; }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            box-shadow: 0 0 20px #00ff88;
            animation: scan 2s infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .loading-text {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loading-subtext {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Confetti Animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 9998;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Header */
        header {
            padding: 2rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .creators {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
            animation-delay: 0.3s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Score Section */
        .score-section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .score-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Circular Score Display */
        .score-circle-container {
            display: inline-block;
            position: relative;
            margin-bottom: 2rem;
        }

        .score-circle {
            width: 250px;
            height: 250px;
            position: relative;
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 20;
        }

        .circle-progress {
            fill: none;
            stroke-width: 20;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 2s ease, stroke 1s ease;
            filter: drop-shadow(0 0 10px currentColor);
        }

        .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-grade {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
        }

        .score-label {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 1rem;
        }

        /* Grid Layout for Results */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease forwards;
            opacity: 0;
        }

        .result-card:nth-child(1) { animation-delay: 0.5s; }
        .result-card:nth-child(2) { animation-delay: 0.7s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .card-icon {
            font-size: 2rem;
        }

        /* Matched Skills Badges */
        .skills-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .skill-badge {
            background: linear-gradient(135deg, #00d2ff 0%, #3a47d5 100%);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(58, 71, 213, 0.3);
            animation: popIn 0.4s ease;
        }

        .skill-badge.matched {
            background: linear-gradient(135deg, #00f260 0%, #0575e6 100%);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Warning Section */
        .warning-section {
            background: rgba(255, 87, 87, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid rgba(255, 87, 87, 0.3);
            box-shadow: 0 20px 60px rgba(255, 87, 87, 0.2);
            animation: slideUp 0.6s ease forwards;
            animation-delay: 0.9s;
            opacity: 0;
            margin-bottom: 2rem;
        }

        .warning-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff5757;
        }

        .warning-icon {
            font-size: 2rem;
        }

        .missing-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .missing-item {
            background: rgba(255, 87, 87, 0.2);
            padding: 1rem;
            border-radius: 10px;
            border-left: 4px solid #ff5757;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Tips Section */
        .tips-section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease forwards;
            animation-delay: 1.1s;
            opacity: 0;
            margin-bottom: 2rem;
        }

        .tips-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }

        .tip-item {
            background: rgba(255, 215, 0, 0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 4px solid #ffd700;
            display: flex;
            gap: 1rem;
        }

        .tip-number {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a1a2e;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            animation: slideUp 0.6s ease forwards;
            animation-delay: 1.3s;
            opacity: 0;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 1.2rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.6);
        }

        /* Sections Checklist */
        .checklist-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .checklist-item.found {
            border-left: 4px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .checklist-item.missing {
            border-left: 4px solid #ff5757;
            background: rgba(255, 87, 87, 0.1);
        }

        .check-icon {
            font-size: 1.5rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .results-grid {
                grid-template-columns: 1fr;
            }

            .score-circle {
                width: 200px;
                height: 200px;
            }

            .score-value {
                font-size: 3rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                min-width: 100%;
            }

            .scanner-container {
                width: 200px;
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="scanner-container">
            <div class="document-icon">
                <div class="document-lines">
                    <div class="doc-line"></div>
                    <div class="doc-line"></div>
                    <div class="doc-line"></div>
                    <div class="doc-line"></div>
                    <div class="doc-line"></div>
                </div>
                <div class="scan-line"></div>
            </div>
        </div>
        <div class="loading-text">Analyzing Your CV...</div>
        <div class="loading-subtext">Extracting skills and keywords</div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">CV ANALYZER</div>
        <div class="creators">Created by Zohaib, Affan & Moiz</div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Score Section -->
        <div class="score-section">
            <div class="score-title">📊 Your CV Analysis Score</div>
            
            <div class="score-circle-container">
                <svg class="score-circle" viewBox="0 0 200 200">
                    <circle class="circle-bg" cx="100" cy="100" r="90"></circle>
                    <circle class="circle-progress" id="progressCircle" cx="100" cy="100" r="90"></circle>
                </svg>
                <div class="score-value" id="scoreValue">0</div>
                <div class="score-grade" id="scoreGrade">-</div>
            </div>
            
            <div class="score-label">Overall Match Score</div>
        </div>

        <!-- Results Grid -->
        <div class="results-grid">
            <!-- Matched Skills -->
            <div class="result-card">
                <div class="card-header">
                    <span class="card-icon">✅</span>
                    <span>Matched Skills</span>
                </div>
                <div class="skills-badges" id="matchedSkills"></div>
            </div>

            <!-- CV Sections Found -->
            <div class="result-card">
                <div class="card-header">
                    <span class="card-icon">📋</span>
                    <span>CV Sections</span>
                </div>
                <div id="sectionsChecklist"></div>
            </div>
        </div>

        <!-- Warning Section (Missing Skills) -->
        <div class="warning-section" id="warningSection">
            <div class="warning-header">
                <span class="warning-icon">⚠️</span>
                <span>Missing Required Skills</span>
            </div>
            <div class="missing-items" id="missingSkills"></div>
        </div>

        <!-- Tips Section -->
        <div class="tips-section" id="tipsSection">
            <div class="tips-header">
                <span>💡</span>
                <span>Recommendations to Improve Your CV</span>
            </div>
            <div id="tipsList"></div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="downloadPDF()">
                📥 Download Report as PDF
            </button>
            <button class="btn btn-primary" onclick="analyzeAnother()">
                🔄 Analyze Another CV
            </button>
        </div>
    </div>

    <script>
        // Simulate loading and show results
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
                generateResults();
            }, 3000);
        });

        function generateResults() {
            // For demo purposes - in production, this data comes from backend API
            const mockData = {
                score: 85,
                matchedSkills: ['Python', 'JavaScript', 'React', 'SQL', 'Git', 'Communication'],
                missingSkills: ['Docker', 'AWS', 'Leadership'],
                sections: {
                    'Contact Information': true,
                    'Professional Summary': true,
                    'Work Experience': true,
                    'Education': true,
                    'Skills': true,
                    'Certifications': false,
                    'Projects': true
                }
            };

            // Animate score
            animateScore(mockData.score);

            // Show confetti if score > 80
            if (mockData.score > 80) {
                createConfetti();
            }

            // Display matched skills
            const matchedContainer = document.getElementById('matchedSkills');
            mockData.matchedSkills.forEach((skill, index) => {
                setTimeout(() => {
                    const badge = document.createElement('div');
                    badge.className = 'skill-badge matched';
                    badge.innerHTML = `<span>✓</span><span>${skill}</span>`;
                    matchedContainer.appendChild(badge);
                }, index * 100);
            });

            // Display missing skills
            const missingContainer = document.getElementById('missingSkills');
            if (mockData.missingSkills.length > 0) {
                mockData.missingSkills.forEach((skill, index) => {
                    setTimeout(() => {
                        const item = document.createElement('div');
                        item.className = 'missing-item';
                        item.innerHTML = `<span>❌</span><span><strong>${skill}</strong> - Not found in your CV</span>`;
                        missingContainer.appendChild(item);
                    }, index * 150);
                });
            } else {
                document.getElementById('warningSection').style.display = 'none';
            }

            // Display sections checklist
            const sectionsContainer = document.getElementById('sectionsChecklist');
            Object.entries(mockData.sections).forEach(([section, found], index) => {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.className = `checklist-item ${found ? 'found' : 'missing'}`;
                    item.innerHTML = `
                        <span class="check-icon">${found ? '✅' : '❌'}</span>
                        <span>${section}</span>
                    `;
                    sectionsContainer.appendChild(item);
                }, index * 100);
            });

            // Generate dynamic tips based on missing skills
            generateTips(mockData.missingSkills, mockData.sections);
        }

        function animateScore(targetScore) {
            const scoreElement = document.getElementById('scoreValue');
            const gradeElement = document.getElementById('scoreGrade');
            const progressCircle = document.getElementById('progressCircle');
            
            const radius = 90;
            const circumference = 2 * Math.PI * radius;
            
            // Set initial state
            progressCircle.style.strokeDasharray = circumference;
            progressCircle.style.strokeDashoffset = circumference;

            // Determine color and grade based on score
            let color, grade;
            if (targetScore >= 90) {
                color = '#00ff88';
                grade = 'A+';
            } else if (targetScore >= 80) {
                color = '#00d4ff';
                grade = 'A';
            } else if (targetScore >= 70) {
                color = '#4facfe';
                grade = 'B';
            } else if (targetScore >= 60) {
                color = '#ffd700';
                grade = 'C';
            } else {
                color = '#ff5757';
                grade = 'D';
            }

            progressCircle.style.stroke = color;

            // Animate number counting
            let currentScore = 0;
            const increment = targetScore / 100;
            const timer = setInterval(() => {
                currentScore += increment;
                if (currentScore >= targetScore) {
                    currentScore = targetScore;
                    clearInterval(timer);
                }
                scoreElement.textContent = Math.round(currentScore);
                
                // Update circle progress
                const offset = circumference - (currentScore / 100) * circumference;
                progressCircle.style.strokeDashoffset = offset;
            }, 20);

            // Show grade after animation
            setTimeout(() => {
                gradeElement.textContent = grade;
            }, 1500);
        }

        function createConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#00ff88', '#ffd700'];
            const confettiCount = 100;

            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        function generateTips(missingSkills, sections) {
            const tipsContainer = document.getElementById('tipsList');
            const tips = [];

            // Dynamic tips based on missing skills
            if (missingSkills.length > 0) {
                tips.push(`Add the following skills to your CV: ${missingSkills.join(', ')}. These are in high demand for this position.`);
            }

            // Tips based on missing sections
            if (!sections['Certifications']) {
                tips.push('Consider adding a Certifications section to showcase your professional credentials and continuous learning.');
            }

            // Generic improvement tips
            tips.push('Use action verbs like "Led", "Developed", "Implemented" to make your experience more impactful.');
            tips.push('Quantify your achievements with numbers, percentages, or metrics whenever possible.');
            tips.push('Keep your CV concise - aim for 1-2 pages for most positions.');
            tips.push('Tailor your CV for each job application by highlighting relevant skills and experience.');

            tips.forEach((tip, index) => {
                setTimeout(() => {
                    const tipItem = document.createElement('div');
                    tipItem.className = 'tip-item';
                    tipItem.innerHTML = `
                        <div class="tip-number">${index + 1}</div>
                        <div>${tip}</div>
                    `;
                    tipsContainer.appendChild(tipItem);
                }, index * 200);
            });
        }

        function downloadPDF() {
            // In production, this would trigger a PDF generation on backend
            alert('📥 PDF download functionality will be connected to your backend API.\n\nBackend should generate a PDF report with:\n- Score breakdown\n- Matched/Missing skills\n- Section analysis\n- Improvement recommendations');
            
            // Example of what the backend call would look like:
            // fetch('/api/download-report', {
            //     method: 'POST',
            //     body: JSON.stringify(analysisData)
            // })
            // .then(response => response.blob())
            // .then(blob => {
            //     const url = window.URL.createObjectURL(blob);
            //     const a = document.createElement('a');
            //     a.href = url;
            //     a.download = 'cv-analysis-report.pdf';
            //     a.click();
            // });
        }

        function analyzeAnother() {
            window.location.href = 'index.html'; // or whatever your upload page is named
        }

        // Print functionality
        window.addEventListener('beforeprint', () => {
            document.getElementById('loadingScreen').style.display = 'none';
        });
    </script>
</body>
</html>
